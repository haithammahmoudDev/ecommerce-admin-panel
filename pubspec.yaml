name: ecommerce_admin_pannal
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  get_storage: ^2.1.1
  flutter_bloc: ^9.1.1

  ## -- OnBoarding PACKAGES
  liquid_swipe: ^3.1.0
  smooth_page_indicator: ^1.2.1

  ## -- OTP TEXT FIELD PACKAGE
  otp_text_field: ^1.1.3
  flutter_otp_text_field: ^1.1.1

  ## -- FIREBASE PACKAGES
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  firebase_messaging: ^16.0.4
  firebase_crashlytics: ^5.0.5


  ## -- ICON PACKAGES
  iconsax: ^0.0.8
  line_awesome_flutter: ^3.0.1

  ## -- Utility PACKAGES
  intl: ^0.20.2
  logger: ^2.6.2
  lottie: ^3.3.1
  badges: ^3.1.2
  shimmer: ^3.0.0
  readmore: ^3.0.0
  url_launcher: ^6.3.2
  carousel_slider: ^5.1.1
  connectivity_plus: ^7.0.0
  country_code_picker: ^3.4.1
  # Notification
  flutter_local_notifications: ^19.2.1
  flutter_dropzone: ^4.2.1
  universal_html: ^2.3.0

  supabase_flutter: ^2.9.0
  equatable: ^2.1.0
  google_fonts: ^8.2.0
  dartz: ^0.10.1
  flutter_rating_bar: ^4.0.1
  flutter_facebook_auth: ^7.2.0
  google_sign_in: ^7.2.0
  hive_ce_flutter: ^2.3.4
  get_it: ^9.2.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  flutter_dotenv: ^6.0.1
  cached_network_image: ^3.4.1
  # web
  url_strategy: ^0.3.0
  multi_select_flutter: ^4.1.3
  fl_chart: ^1.2.0
  data_table_2: ^2.7.2
  web: ^1.1.1
  http: ^1.6.0
  dio: ^5.11.0
  html: ^0.15.6
  go_router: ^17.5.0
  gif: ^2.3.0
  flutter_image_compress: ^2.5.1
  image: ^4.9.2
  flutter_typeahead: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/logos/
    - assets/images/
    - assets/icons/brands/
    - assets/images/profile/
    - assets/images/dashboard/
    - assets/images/splash_images/
    - assets/images/welcome_images/
    - assets/images/forget_password/
    - assets/images/on_boarding_images/
    - assets/images/animations/
    - assets/images/banners/
    - assets/icons/payment_methods/
    - assets/images/products/
    - assets/images/brands/
    - assets/icons/categories/
    - assets/icons/payment_methods/
    - .env

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist/static/Urbanist-Light.ttf
          weight: 300
        - asset: assets/fonts/Urbanist/static/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Urbanist/static/Urbanist-Italic.ttf
          style: italic
        - asset: assets/fonts/Urbanist/static/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist/static/Urbanist-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Urbanist/static/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Urbanist/static/Urbanist-Bold.ttf
          weight: 800
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
